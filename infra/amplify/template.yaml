AWSTemplateFormatVersion: "2010-09-09"
Description: >
  yulinxin-site, phase 1. AWS Amplify Hosting app with manual (zip) deployments.
  No Git connection: scripts/deploy-amplify.sh uploads the site/ folder.

Parameters:
  AppName:
    Type: String
    Default: yulinxin-site
  BranchName:
    Type: String
    Default: main

Resources:
  App:
    Type: AWS::Amplify::App
    Properties:
      Name: !Ref AppName
      Description: Personal website of Yulin Xin (static, trilingual)
      Platform: WEB
      CustomHeaders: |
        customHeaders:
          - pattern: '**'
            headers:
              - key: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - key: X-Content-Type-Options
                value: nosniff
              - key: Referrer-Policy
                value: strict-origin-when-cross-origin
              - key: Permissions-Policy
                value: camera=(), microphone=(), geolocation=()
              - key: Content-Security-Policy
                value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
          - pattern: 'index.html'
            headers:
              - key: Cache-Control
                value: public, max-age=300
          - pattern: '*.{jpg,svg}'
            headers:
              - key: Cache-Control
                value: public, max-age=86400
      Tags:
        - Key: project
          Value: yulinxin-site

  Branch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt App.AppId
      BranchName: !Ref BranchName
      Stage: PRODUCTION
      EnableAutoBuild: false
      Tags:
        - Key: project
          Value: yulinxin-site

Outputs:
  AppId:
    Value: !GetAtt App.AppId
  BranchName:
    Value: !GetAtt Branch.BranchName
  SiteUrl:
    Description: Default Amplify URL of the production branch
    Value: !Sub "https://${BranchName}.${App.DefaultDomain}"
